[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datasitr-scc-verifier"
version = "0.2.2"
description = "Draft verifier for machine-checkable elements of Saudi SCC transfer documentation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Data Sitr Est." }]
keywords = [
    "sdaia",
    "scc",
    "pdpl",
    "saudi-arabia",
    "data-transfer",
    "compliance",
    "verifier",
    "json-schema",
    "open-policy-agent",
    "rego",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    "cryptography>=42.0",
    "jsonschema>=4.21",
    "jcs>=0.2.1",
    # jsonschema's FormatChecker silently skips date-time checks if none
    # of rfc3339-validator / strict-rfc3339 / isoduration is installed.
    # We pin rfc3339-validator so the date-time format is actually enforced.
    "rfc3339-validator>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
scc-verify = "scc_verifier.cli:main"

[project.urls]
Homepage = "https://github.com/Data-Sitr-KSA/datasitr-scc-verifier"
Repository = "https://github.com/Data-Sitr-KSA/datasitr-scc-verifier"
Issues = "https://github.com/Data-Sitr-KSA/datasitr-scc-verifier/issues"
Changelog = "https://github.com/Data-Sitr-KSA/datasitr-scc-verifier/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["scc_verifier"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "schemas"
"rules" = "rules"
"test_vectors" = "test_vectors"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Default selection is quiet; explicitly enable the common-sense set.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear (likely bugs)
    "UP",   # pyupgrade (modern syntax)
    "W",    # pycodestyle warnings
]
ignore = [
    "E501",  # line length (ruff format enforces this)
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to shadow names, do unused-ignores, etc.
"tests/*" = ["B", "UP"]

[tool.mypy]
python_version = "3.11"
# Start strict and loosen where needed; nothing currently triggers strict
# failures, so strict stays on by default. Dependency stubs come from
# their own packages or are treated as Any.
strict = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
# The tests directory intentionally does more duck-typing; keep mypy
# scoped to the library itself.
files = ["scc_verifier"]

[[tool.mypy.overrides]]
module = "jcs"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
