[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datasitr-scc-verifier"
version = "0.1.0"
description = "Machine-verifiable compliance for SDAIA Standard Contractual Clauses under the Saudi PDPL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Data Sitr Est." }]
keywords = ["pdpl", "sdaia", "scc", "privacy", "compliance", "saudi-arabia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]

dependencies = [
    "cryptography>=42.0",
    "jsonschema>=4.21",
    "jcs>=0.2.1",
    # jsonschema's FormatChecker silently skips date-time checks if none
    # of rfc3339-validator / strict-rfc3339 / isoduration is installed.
    # We pin rfc3339-validator so the date-time format is actually enforced.
    "rfc3339-validator>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
scc-verify = "scc_verifier.cli:main"

[project.urls]
Homepage = "https://github.com/Data-Sitr-KSA/datasitr-scc-verifier"
Issues = "https://github.com/Data-Sitr-KSA/datasitr-scc-verifier/issues"

[tool.hatch.build.targets.wheel]
packages = ["scc_verifier"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
