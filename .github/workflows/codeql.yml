# CodeQL — static analysis (SAST) for Python.
#
# Runs GitHub's CodeQL engine against the Python source in scc_verifier/.
# CodeQL is free for this public repository and uploads findings to
# GitHub code scanning.
#
# Why CodeQL on top of ruff + mypy:
#   - ruff catches style and trivially-wrong patterns.
#   - mypy catches type mismatches.
#   - CodeQL catches semantic security issues (injection, SSRF, insecure
#     deserialization, timing-sensitive comparison, etc.) that neither
#     ruff nor mypy will ever flag.
#
# Scorecard weight: CodeQL presence materially improves the SAST score
# in OpenSSF Scorecard. Combined with the scorecard.yml workflow, this
# covers the two highest-signal Scorecard checks for a Python project.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Thursday 04:23 UTC — staggered off scorecard.yml (Monday) so the
    # two security workflows share no scheduling pressure.
    - cron: "23 4 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL analysis (python)
    runs-on: ubuntu-latest

    # Keep this guard so private forks do not fail without GitHub Advanced
    # Security; the canonical repository is public and runs this job.
    if: github.event.repository.private == false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          # `security-and-quality` is the wider query suite; picks up
          # standard security queries plus code-quality issues.
          queries: security-and-quality

      - name: Perform analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
