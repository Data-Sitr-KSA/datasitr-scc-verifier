# OpenSSF Scorecard — security-hygiene scoring.
#
# Runs on pull requests, pushes to main, branch-protection changes, and
# weekly. Evaluates the repository against the ~20 checks maintained by
# the OpenSSF Scorecard project (branch protection, code review, CI tests,
# SAST, signed releases, pinned dependencies, dangerous workflow patterns,
# token permissions, license, dependabot, etc.).
#
# Results:
#   - SARIF stored as a workflow artifact for reviewer inspection.
#   - When `publish_results: true`, results are also published to the
#     OpenSSF Scorecard public API, which feeds the live badge at
#     api.securityscorecards.dev.
#
# This repository is public, so Scorecard publishes results to the public API
# on main pushes while PRs use Scorecard as a required status check.
#
# Reference: https://github.com/ossf/scorecard-action

name: Scorecard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  branch_protection_rule:
  schedule:
    # Monday 03:17 UTC — off-minute to avoid the fleet-wide :00 spike on
    # free runners. The exact minute doesn't matter; picking something
    # non-round is polite to shared infrastructure.
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Top-level: deny-all. Individual jobs widen permissions as needed.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest

    # Keep this guard so private forks do not fail while trying to publish
    # public Scorecard results; the canonical repository is public.
    if: github.event.repository.private == false

    # Scorecard needs these scopes:
    #   id-token: write  — OIDC token for publish_results
    #   contents: read   — read repo content
    #   actions: read    — inspect workflow files
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' }}

      # Persist the SARIF as a build artifact so reviewers can download
      # and inspect the exact analysis output.
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 14
