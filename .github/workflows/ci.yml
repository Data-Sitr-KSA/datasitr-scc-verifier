name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Single-flight per PR to avoid race conditions on bundle-hash tests.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install OPA (linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          OPA_VERSION="v1.15.2"
          curl -fsSL -o /usr/local/bin/opa \
            "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version

      - name: Install OPA (macos)
        if: runner.os == 'macOS'
        run: |
          brew install opa
          opa version

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check scc_verifier tests

      - name: Ruff format check
        run: ruff format --check scc_verifier tests

      - name: Mypy type check
        run: mypy scc_verifier --ignore-missing-imports

      - name: Pytest
        run: pytest -v --tb=short

      - name: End-to-end smoke — verify + self-validate + run-vectors
        run: |
          set -euo pipefail
          # Verify against the known-good vector and inspect the attestation.
          scc-verify verify \
            --scc test_vectors/known_good/ksa_to_foreign_processor_scc.json \
            --out /tmp/attestation.json
          python -c "
          import json, sys
          from scc_verifier.schema_validator import validate_attestation_envelope
          env = json.load(open('/tmp/attestation.json'))
          r = validate_attestation_envelope(env)
          assert r.valid, f'self-validation failed: {r.errors}'
          subj = env['credentialSubject']
          assert subj['verdict'] == 'PASS_WITH_COUNSEL_ITEMS', subj['verdict']
          assert env['proof']['proofValue'].startswith('ed25519:'), env['proof']
          print(f\"OK: verdict={subj['verdict']}, checks={len(subj['checks'])}\")
          "
          # Run the full vector corpus.
          scc-verify run-vectors

      - name: Test-vector corpus contract (exit 0 on 0 divergences)
        run: scc-verify run-vectors

  # Separate job: confirm missing OPA cannot produce a clean PASS.
  # This locks the INCOMPLETE contract while still allowing an explicit
  # Layer-1-only run when the caller opts in.
  test-without-opa:
    name: test (no OPA installed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev deps (no OPA)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Confirm OPA is absent
        run: |
          if command -v opa >/dev/null 2>&1; then
            echo "UNEXPECTED: opa is installed" && exit 1
          fi
          echo "Confirmed: no opa on PATH"

      - name: Pytest (Rego tests should auto-skip)
        run: pytest -v --tb=short

      - name: Verify emits INCOMPLETE without OPA
        run: |
          set -euo pipefail
          set +e
          scc-verify verify \
            --scc test_vectors/known_good/ksa_to_foreign_processor_scc.json \
            --out /tmp/attestation.json
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 0 ]; then
            echo "expected non-zero exit when OPA is absent, got $exit_code"
            exit 1
          fi
          python -c "
          import json
          env = json.load(open('/tmp/attestation.json'))
          subj = env['credentialSubject']
          assert subj['verdict'] == 'INCOMPLETE', subj['verdict']
          incomplete = [
              c for c in subj['checks']
              if c['status'] == 'INCOMPLETE'
              and (c['id'].startswith('VAL-') or c['id'].startswith('JUDGE-'))
          ]
          assert incomplete, 'expected Layer-2 INCOMPLETE checks when OPA is absent'
          assert any('OPA binary not available' in c.get('detail', '') for c in incomplete)
          print(f\"OK: missing-OPA verdict={subj['verdict']}, {len(incomplete)} INCOMPLETE checks\")
          "

          scc-verify verify \
            --scc test_vectors/known_good/ksa_to_foreign_processor_scc.json \
            --out /tmp/attestation-allow.json \
            --allow-incomplete-without-opa
          python -c "
          import json
          env = json.load(open('/tmp/attestation-allow.json'))
          subj = env['credentialSubject']
          assert subj['verdict'] == 'INCOMPLETE', subj['verdict']
          print(f\"OK: allow flag returned zero while verdict stayed {subj['verdict']}\")
          "
